# On every push to main (every merged PR): build the three images, push them to GHCR, and
# point deploy/kustomization.yaml at them. Argo CD sees that commit and deploys it.
# Adapted from skyhook-io/cnh-starter.
name: build-and-deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - deploy/kustomization.yaml
      - "**.md"
      - "meeting-recordings/**"
      - "demo/**"
      - "research/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
            service: ""
          - name: search-api
            dockerfile: services/Dockerfile
            service: search-api
          - name: game-api
            dockerfile: services/Dockerfile
            service: game-api
    steps:
      - uses: actions/checkout@v5
      - name: Image name and tag
        id: meta
        run: |
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/conquest-${{ matrix.name }}" >> "$GITHUB_OUTPUT"
          echo "tag=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            SERVICE=${{ matrix.service }}
            APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:latest
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Point the manifests at the new images
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          TAG="${GITHUB_SHA::7}"
          OWNER="${OWNER,,}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard FETCH_HEAD
            for n in web search-api game-api; do
              N="$n" IMG="ghcr.io/${OWNER}/conquest-$n" T="$TAG" \
                yq -i '(.images[] | select(.name == strenv(N))) |= (.newName = strenv(IMG) | .newTag = strenv(T))' deploy/kustomization.yaml
            done
            if git diff --quiet; then exit 0; fi
            git commit -qam "deploy: ${TAG} [skip ci]"
            if git push -q origin HEAD:main; then exit 0; fi
            sleep $((attempt * 3))
          done
          echo "Couldn't push the deploy commit after 5 tries." >&2
          exit 1
