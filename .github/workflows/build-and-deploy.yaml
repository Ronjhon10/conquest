# On every push to main (every merged PR): build the three images, push them to GHCR, then
# write main + the new image tags to the `deploy` branch. Argo CD tracks `deploy`, so main stays
# protected (PRs only) and the bot never pushes to it.
# Adapted from skyhook-io/cnh-starter.
name: build-and-deploy

on:
  push:
    branches: [main]
    paths-ignore:
      - "**.md"
      - "meeting-recordings/**"
      - "demo/**"
      - "research/**"
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: build-and-deploy
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      # One image's push failing must not cancel the other two (GHCR intermittently answers
      # "denied: permission_denied: write_package" on one image per run; seen 2026-11-09 22:11-22:15).
      fail-fast: false
      matrix:
        include:
          - name: web
            dockerfile: apps/web/Dockerfile
            service: ""
          - name: search-api
            dockerfile: services/Dockerfile
            service: search-api
          - name: game-api
            dockerfile: services/Dockerfile
            service: game-api
    steps:
      - uses: actions/checkout@v5
      - name: Image name and tag
        id: meta
        run: |
          # All three images live in ONE package (conquest-web, public), tagged <name>-<sha7>.
          # With three packages, the jobs pushed the same base layers into three packages at
          # once and GHCR denied one of them each run (permission_denied: write_package on the
          # shared layers, 2026-11-09 22:11+), so nothing deployed. One package, no cross-package
          # layer mounts.
          echo "image=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/conquest-web" >> "$GITHUB_OUTPUT"
          echo "tag=${{ matrix.name }}-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"
          echo "latest=${{ matrix.name }}-latest" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        id: push
        continue-on-error: true
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            SERVICE=${{ matrix.service }}
            APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.latest }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
      - name: Retry the push once after a pause
        if: steps.push.outcome == 'failure'
        run: sleep 20
      - uses: docker/build-push-action@v6
        if: steps.push.outcome == 'failure'
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          push: true
          build-args: |
            SERVICE=${{ matrix.service }}
            APP_VERSION=${{ steps.meta.outputs.tag }}
          tags: |
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}
            ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.latest }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}

  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Point the manifests at the new images, on the deploy branch
        env:
          OWNER: ${{ github.repository_owner }}
        run: |
          TAG="${GITHUB_SHA::7}"
          OWNER="${OWNER,,}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Build deploy from the commit this run built, so each deploy matches its images.
          git fetch -q origin "$GITHUB_SHA"
          git reset -q --hard "$GITHUB_SHA"
          for n in web search-api game-api; do
            N="$n" IMG="ghcr.io/${OWNER}/conquest-web" T="$n-$TAG" \
              yq -i '(.images[] | select(.name == strenv(N))) |= (.newName = strenv(IMG) | .newTag = strenv(T))' deploy/kustomization.yaml
          done
          git commit -qam "deploy: ${TAG} [skip ci]"
          git push -qf origin HEAD:deploy
