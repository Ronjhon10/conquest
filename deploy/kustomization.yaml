# Argo CD deploys this folder from the `deploy` branch. On main the tags stay `latest`;
# build-and-deploy writes the real tags on the deploy branch. Don't edit newName/newTag by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-__TEAM__
resources:
  - web.yaml
  - search-api.yaml
  - game-api.yaml
  - services.yaml
  - httproute.yaml
images:
  - name: web
    newName: ghcr.io/ronjhon10/conquest-web
    newTag: f9387ce
  - name: search-api
    newName: ghcr.io/ronjhon10/conquest-search-api
    newTag: f9387ce
  - name: game-api
    newName: ghcr.io/ronjhon10/conquest-game-api
    newTag: f9387ce
