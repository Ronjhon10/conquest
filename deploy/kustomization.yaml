# Argo CD deploys this folder to the team namespace on every push to main.
# The build-and-deploy Action sets the images below on every push; don't edit newName/newTag by hand.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: team-__TEAM__
resources:
  - web.yaml
  - search-api.yaml
  - game-api.yaml
  - services.yaml
  - httproute.yaml
images:
  - name: web
    newName: ghcr.io/ronjhon10/conquest-web
    newTag: latest
  - name: search-api
    newName: ghcr.io/ronjhon10/conquest-search-api
    newTag: latest
  - name: game-api
    newName: ghcr.io/ronjhon10/conquest-game-api
    newTag: latest
