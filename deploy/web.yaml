apiVersion: apps/v1
kind: Deployment
metadata:
  name: web
  labels:
    app: web
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never take the last ready pod down during a deploy
      maxSurge: 1
  selector:
    matchLabels:
      app: web
  template:
    metadata:
      labels:
        app: web
    spec:
      automountServiceAccountToken: false   # the app never calls the Kubernetes API
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: web
      containers:
        - name: web
          image: web
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DEPLOY_ENV
              value: demo
            - name: NEXT_PUBLIC_DASH0_DASHBOARD_URL
              value: "https://app.dash0.com/dashboards/dfbb1620-2d26-4ed5-99f1-50c27d553306?dataset=default"
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m   # team-quota caps limits.cpu at 10 for the whole vcluster (platform included)
              memory: 512Mi
          lifecycle:
            preStop:
              sleep:
                seconds: 5   # let the Service drop this pod before it stops (no 503s during deploys)
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
