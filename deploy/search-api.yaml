apiVersion: apps/v1
kind: Deployment
metadata:
  name: search-api
  labels:
    app: search-api
spec:
  replicas: 2
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0   # never take the last ready pod down during a deploy
      maxSurge: 1
  selector:
    matchLabels:
      app: search-api
  template:
    metadata:
      labels:
        app: search-api
    spec:
      automountServiceAccountToken: false   # the app never calls the Kubernetes API
      terminationGracePeriodSeconds: 30
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app: search-api
      containers:
        - name: search-api
          image: search-api
          ports:
            - name: http
              containerPort: 8080
          env:
            - name: DEPLOY_ENV
              value: demo
            - name: ELASTICSEARCH_URL
              valueFrom:
                secretKeyRef:
                  name: conquest-secrets
                  key: elasticsearch-url
                  optional: true
            - name: ELASTICSEARCH_API_KEY
              valueFrom:
                secretKeyRef:
                  name: conquest-secrets
                  key: elasticsearch-api-key
                  optional: true
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: conquest-secrets
                  key: openai-api-key
                  optional: true
            - name: DASH0_AUTH_TOKEN
              valueFrom:
                secretKeyRef:
                  name: conquest-secrets
                  key: dash0-auth-token
                  optional: true
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              valueFrom:
                secretKeyRef:
                  name: conquest-secrets
                  key: dash0-otlp-endpoint
                  optional: true
            - name: OTEL_EXPORTER_OTLP_HEADERS
              value: "Authorization=Bearer $(DASH0_AUTH_TOKEN)"
            - name: OTEL_SERVICE_NAME
              value: conquest-search-api
          resources:
            requests:
              cpu: 100m
              memory: 192Mi
            limits:
              cpu: 250m   # team-quota caps limits.cpu at 10 for the whole vcluster (platform included)
              memory: 512Mi
          lifecycle:
            preStop:
              sleep:
                seconds: 5   # let the Service drop this pod before it stops (no 503s during deploys)
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          securityContext:
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            seccompProfile:
              type: RuntimeDefault
            capabilities:
              drop: ["ALL"]
