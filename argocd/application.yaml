# Create this once (ask your agent to apply it through Radar's MCP, apply_resource), and Argo CD
# deploys deploy/ from the `deploy` branch (main plus the image tags, rewritten on every merge to main). The repo is public so Argo CD reads it without credentials.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: app
  namespace: team-__TEAM__
spec:
  project: team-__TEAM__
  source:
    repoURL: https://github.com/Ronjhon10/conquest.git
    targetRevision: deploy   # main + image tags, written by build-and-deploy
    path: deploy
  destination:
    server: https://kubernetes.default.svc
    namespace: team-__TEAM__
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
